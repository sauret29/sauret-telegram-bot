name: Bitman Backtest (manual)

"on":
  workflow_dispatch:
    inputs:
      simbolo:
        description: 'Simbolo a analizar (ej. BTCUSDT, ETHUSDT)'
        required: true
        default: 'BTCUSDT'
      meses:
        description: 'Meses de histórico a analizar (Binance solo tiene BTCUSDT desde 2017)'
        required: true
        default: '6'
      meses_reservados:
        description: 'Meses recientes a reservar para validación fuera de muestra (Análisis H)'
        required: true
        default: '12'

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar backtest (puede tardar varios minutos con periodos largos)
        env:
          SYMBOL: ${{ github.event.inputs.simbolo }}
          MESES_HISTORICO: ${{ github.event.inputs.meses }}
          MESES_RESERVADOS: ${{ github.event.inputs.meses_reservados }}
        run: node bitman-backtest.js
