name: Bitman Telegram Alert
"on":
  schedule:
    # Cada 15 minutos, en los minutos 0/15/30/45. Los otros dos bots corren
    # en :05 y :10 para que los tres no hagan push a la vez y se pisen.
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:          # permite pulsar "Run workflow" en la pestaña Actions para probarlo a mano
permissions:
  contents: write            # necesario para poder guardar el estado (state.json) en el repo
jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar señales y avisar si algo cambió
        env:
          SYMBOL: 'BTCUSDT'
          STRATEGY: 'base'
          KONCORDE_FILTER: 'true'
          ENHANCED_FILTER: 'false'
          REINFORCED_DAILY_GATE: 'false'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bots-en-vivo/bitman-telegram-bot.js
      - name: Guardar el estado actualizado (para saber qué cambió la próxima vez)
        run: |
          git config user.name "bitman-bot"
          git config user.email "bitman-bot@users.noreply.github.com"
          git add bots-en-vivo/state.json
          git diff --staged --quiet && exit 0
          git commit -m "Actualizar estado de señales [skip ci]"
          # Sin reintentos, un choque con otro bot dejaba el estado sin guardar
          # y la siguiente ejecución reenviaba la misma alerta.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Intento $i: choque con otro commit, reintentando en unos segundos..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "No se pudo subir el estado tras varios intentos."
          exit 1
