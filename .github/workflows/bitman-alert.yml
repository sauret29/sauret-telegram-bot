name: Bitman Telegram Alert

"on":
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos (mínimo permitido por GitHub Actions: 5 min)
  workflow_dispatch:          # permite pulsar "Run workflow" en la pestaña Actions para probarlo a mano

permissions:
  contents: write            # necesario para poder guardar el estado (state.json) en el repo

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar señales y avisar si algo cambió
        env:
          # --- Configuración de la estrategia: edita estos valores a tu gusto ---
          SYMBOL: 'BTCUSDT'
          STRATEGY: 'base'                 # 'base' o 'pro'
          KONCORDE_FILTER: 'true'
          ENHANCED_FILTER: 'false'
          REINFORCED_DAILY_GATE: 'false'
          # --- Credenciales de Telegram: NO se ponen aquí, se leen de Settings → Secrets ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bitman-telegram-bot.js

      - name: Guardar el estado actualizado (para saber qué cambió la próxima vez)
        run: |
          git config user.name "bitman-bot"
          git config user.email "bitman-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Actualizar estado de señales [skip ci]"
          git push
