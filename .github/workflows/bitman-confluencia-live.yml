name: El Cauto Temerario Live

"on":
  schedule:
    - cron: '5,20,35,50 * * * *'   # desplazado 5 min para no chocar con los otros bots
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-cauto-temerario:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar señal y avisar si algo cambió
        env:
          SYMBOL: 'BTCUSDT'
          TELEGRAM_BOT_TOKEN: ${{ secrets.CONFLUENCIA_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CONFLUENCIA_CHAT_ID }}
        run: node bots-en-vivo/bitman-cauto-temerario-live.js

      - name: Guardar el estado actualizado
        run: |
          git config user.name "cauto-temerario-bot"
          git config user.email "cauto-temerario-bot@users.noreply.github.com"
          git add bots-en-vivo/state-cauto-temerario.json
          git diff --staged --quiet && exit 0
          git commit -m "Actualizar estado Cauto Temerario [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Intento $i: choque con otro commit, reintentando en unos segundos..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "No se pudo subir el estado tras varios intentos."
          exit 1
