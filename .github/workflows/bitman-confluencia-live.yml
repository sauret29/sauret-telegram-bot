name: Bitman Confluencia Live

"on":
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos, igual que el bot original
  workflow_dispatch:          # permite pulsar "Run workflow" para probarlo a mano

permissions:
  contents: write            # necesario para guardar el estado (state-confluencia.json)

jobs:
  check-confluencia:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar señal y avisar si algo cambió
        env:
          SYMBOL: 'BTCUSDT'
          TELEGRAM_BOT_TOKEN: ${{ secrets.CONFLUENCIA_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CONFLUENCIA_CHAT_ID }}
        run: node bitman-confluencia-live.js

      - name: Guardar el estado actualizado
        run: |
          git config user.name "bitman-confluencia-bot"
          git config user.email "bitman-confluencia-bot@users.noreply.github.com"
          git add state-confluencia.json
          git diff --staged --quiet || git commit -m "Actualizar estado Confluencia [skip ci]"
          git push
